    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(160deg, #000000, #0a0a0a, #111111);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      text-align: center;

    .profile a img {
      width: 130px;

      border: 3px solid #00ffcc;

      transition: transform 0.3s, box-shadow 0.3s;

    .profile a img:hover {

    }

    h1 {

    }

      font-size: 14px;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link {
      display: block;
      background: linear-gradient(90deg, #00ffcc, #0088ff);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 0;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
      transition: all 0.3s;
    }

    .link:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.7);
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }

</head>
